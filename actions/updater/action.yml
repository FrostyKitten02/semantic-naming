name: "Update version"
description: "Runs updater.sh"

inputs:
  version:
    description: "Required current version argument"
    required: true
  mode:
    description: "Required mode argument"
    required: true
  newSuffix:
    description: "Optional new suffix argument"
    required: false
    default: ""
  removeSuffix:
    description: "Optional remove suffix flag"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - id: run-script
      shell: bash
      run: |
        cmd="bash ${{ github.action_path }}/../../scripts/updater.sh ${{ inputs.version }} ${{ inputs.mode }}"
        
        if [[ "${{ inputs.newSuffix }}" != "" ]]; then
          cmd="$cmd -s '${{ inputs.newSuffix }}'"
        fi
        
        if [[ "${{ inputs.removeSuffix }}" != "" ]]; then
          cmd="$cmd -r"
        fi

        echo "Running: $cmd"
        output=$($cmd)
        
        echo "Old version ${{ inputs.version }}, new version $output"
        # set output
        echo "result=$output" >> $GITHUB_OUTPUT